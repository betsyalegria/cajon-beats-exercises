<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time signature trainer</title>
<style>
:root{--bg:#faf9f5;--card:#ffffff;--soft:#f0eee6;--text:#1f1e1d;--muted:#6b6a65;--border:rgba(31,30,29,.15);--accent:#185FA5;--accent-bg:#E6F1FB;--ok:#3B6D11;--ok-bg:#EAF3DE;--bad:#A32D2D;--bad-bg:#FCEBEB;--g1:#7F77DD;--g2:#1D9E75;--on-g:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2927;--soft:#33322f;--text:#f3f1ea;--muted:#a9a79f;--border:rgba(243,241,234,.18);--accent:#85B7EB;--accent-bg:#0C447C;--ok:#97C459;--ok-bg:#27500A;--bad:#F09595;--bad-bg:#791F1F;--g1:#AFA9EC;--g2:#5DCAA5;--on-g:#1f1e1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.ct{font-weight:600;font-size:15px}
details summary{cursor:pointer;font-weight:600;font-size:15px}
.cheat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:14px;margin:8px 0 0}
.cheat div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:4px 0}
.cheat b{font-weight:600;white-space:nowrap}
.rule{font-size:14px;margin:8px 0 0;padding-left:18px}
.rule li{margin-bottom:4px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.pill{background:var(--accent-bg);color:var(--accent);padding:2px 10px;border-radius:999px;font-weight:600}
.staff{background:var(--soft);border-radius:12px;padding:12px 8px}
svg{display:block;width:100%;color:var(--text)}
.q{font-size:14px;color:var(--muted);margin:14px 0 8px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font:inherit;font-size:16px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{background:var(--soft)}
button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
button.sm{font-size:14px;min-height:38px;padding:6px 12px}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
#fb{font-size:15px;min-height:26px;margin-top:12px}
.good{color:var(--ok);font-weight:600}.wrong{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid;border-radius:999px;padding:3px 10px;background:var(--card)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.op{color:var(--muted);font-weight:600}
.total{font-weight:600}
.ar{padding:10px 12px;border-radius:10px;margin-top:8px;background:var(--soft)}
.hd{font-size:14px;line-height:1.4;margin-bottom:8px}
.xtag{color:var(--bad);font-weight:600;font-size:13px}
.sum{font-size:14px;margin-top:8px}
.ar .eq{margin-top:0}
.bt{font-size:14px;line-height:1.5}
.bt svg{margin:-6px 2px}
.nm{font-size:12px;color:var(--muted);line-height:1.2}
.chip b{font-weight:600}
.pairs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pair .nm{max-width:none}
.pair svg{margin:0}
.ar.x{background:var(--bad-bg)}
.lab{font-size:13px;font-weight:600;line-height:1.3}
.lab span{display:block;font-size:12px;font-weight:600;color:var(--bad)}
.lesson{margin-top:10px;padding:10px 12px;background:var(--accent-bg);color:var(--text);border-radius:10px;font-size:14px}
.lesson b{color:var(--accent)}
.ts{display:inline-flex;flex-direction:column;align-items:center;line-height:.95;font-weight:800;font-family:Georgia,'Times New Roman',serif;vertical-align:middle}
.choices .ts{font-size:26px;padding:2px 0}
.ts.i{font-size:15px;margin:0 2px}
.choices button{min-height:72px}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:8px}
.bcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--soft);text-align:center}
.bcell.hold{opacity:.75}
.bn{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--card);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.rule1{font-size:14px;margin-top:10px;line-height:1.5}
.rule1 svg{margin:-6px 2px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s ease}.shake{animation:shake .4s ease}.rise{animation:rise .3s ease}
.staff{position:relative}
.playb{position:absolute;top:8px;right:8px;min-height:32px;padding:4px 10px;font-size:13px;background:var(--card);border-radius:999px}
#snd{min-height:28px;padding:2px 10px;font-size:12px;border-radius:999px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pop,.shake,.rise{animation:none}}
#summary h2{font-size:18px;margin:0 0 8px}
#summary ul{padding-left:20px;margin:8px 0}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Time signature trainer</h1>
<p class="sub" id="sub">Give me the time signature.</p>

<div class="card" id="game">
<div class="top"><span id="qnum">Question 1 of 12</span><span class="pill" id="lvl">Level 1</span><span id="score">0 correct</span><button id="snd">Sound on</button></div>
<div id="focus" style="font-size:13px;color:var(--accent);min-height:20px;margin-bottom:6px"></div>
<div class="staff"><button id="playBtn" class="playb" aria-label="Play the measure">▶ Play</button><svg id="staff" viewBox="0 0 360 100" role="img" aria-label="One measure of rhythm"></svg></div>
<p class="q" id="qtext">What's the time signature?</p>
<div id="beatMsg" style="font-size:14px;margin:-4px 0 6px"></div>
<div class="row" style="margin-top:0"><button id="checkBeats" class="sm" style="display:none">Check my beats</button><button id="clearBeats" class="sm" style="display:none">Clear</button></div>
<div class="choices" id="choices"></div>
<div id="fb" aria-live="polite"></div>
<div class="row"><button id="next" class="primary">Next measure</button></div>
</div>

<div class="card" id="summary" style="display:none">
<h2 id="sumTitle"></h2>
<div id="sumBody"></div>
<div class="row"><button id="again" class="primary">Practice again</button></div>
</div>

<footer>Level 1: quarter-note time with 8ths, 16ths and rests · Level 2: 6/8 and the 3/4 trap · Level 3: everything, including 3/8, 9/8, 12/8 and 5/4</footer>
</main>
<script>
const U={q:2,r:2,e2:2,s4:2,es:2,se:2,h:4,dh:6,e3:3,dq:3,s6:3};
const NAME={q:'quarter',r:'quarter rest',e2:'two 8ths',s4:'four 16ths',es:'8th + two 16ths',se:'two 16ths + 8th',h:'half note',dh:'dotted half',e3:'three 8ths',dq:'dotted quarter',s6:'six 16ths',comp:'groups of three 8ths (bottom = 8)',simp:'quarter-note beats (bottom = 4)'};
const TIP={
q:'A quarter note is 1 beat.',
r:'A rest is silence, but it still takes up time: a quarter rest is 1 beat. Count it.',
e2:'Two 8ths joined by one beam make 1 beat together, not 2.',
s4:'Four 16ths joined by two beams make 1 beat together, not 4.',
es:'One 8th plus two 16ths under one beam still adds up to 1 beat (½ + ¼ + ¼).',
se:'Two 16ths plus one 8th under one beam still adds up to 1 beat (¼ + ¼ + ½).',
h:'A hollow note with a stem is a half note: 2 beats. Tap twice.',
dh:'The dot adds half the note\'s value, so a dotted half is 2 + 1 = 3 beats.',
e3:'In /8 time you count every 8th, so a beamed group of three 8ths counts as 3.',
dq:'A dotted quarter equals three 8ths, so in /8 time it counts as 3.',
s6:'Six 16ths under a beam equal three 8ths, so in /8 time they count as 3.',
comp:'When 8ths are beamed in groups of three (or you see dotted quarters), the music counts in 8ths, so the bottom number is 8. Then count every 8th for the top.',
simp:'When notes group into quarter-note beats (pairs of 8ths, fours of 16ths, quarters), the bottom number is 4. Then count the quarter-note beats for the top.'};
const LV={
1:{simple:['q','r','e2','s4'],comp:null,maxB:4},
2:{simple:['q','r','e2','s4','h'],comp:['e3','dq'],maxB:4,maxG:2},
3:{simple:['q','r','e2','s4','h','dh','es','se'],comp:['e3','dq','s6'],maxB:5,maxG:4}};
const TOTAL=12;
let n,level,streak,missStreak,correct,answered,cur,log,weak;
const $=id=>document.getElementById(id),rnd=a=>a[Math.floor(Math.random()*a.length)];
function wpick(arr){const w=arr.map(k=>weak[k]||1);let t=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){t-=w[i];if(t<=0)return arr[i];}return arr[arr.length-1];}
function focusType(){const L=LV[level];let best=null,bw=1;for(const k in weak){const ok=k==='comp'?!!L.comp:k==='simp'?true:(L.simple.includes(k)||(L.comp&&L.comp.includes(k)));if(ok&&weak[k]>bw){bw=weak[k];best=k;}}return best;}
function gen(){
const L=LV[level],f=focusType(),useF=f&&Math.random()<0.75;
let comp=!!L.comp&&Math.random()<0.45;
if(useF){if(f==='comp'||(L.comp&&L.comp.includes(f)))comp=true;else comp=false;}
for(let t=0;t<400;t++){
if(comp){
const G=level===2?2:1+Math.floor(Math.random()*L.maxG);
const items=[];for(let i=0;i<G;i++)items.push(wpick(L.comp));
if(items.filter(k=>k==='s6').length>2)continue;
if(useF&&f!=='comp'&&!items.includes(f))continue;
return{items,comp:true,top:3*G,bot:8};}
const B=2+Math.floor(Math.random()*(L.maxB-1));let r=2*B,items=[];
while(r>0){const ok=L.simple.filter(k=>U[k]<=r);const k=wpick(ok);items.push(k);r-=U[k];}
if(new Set(items).size<2||items.length>6)continue;
if(level===1&&!(items.includes('e2')||items.includes('s4')))continue;
if(useF&&f!=='simp'&&!items.includes(f))continue;
return{items,comp:false,top:B,bot:4};}
return{items:['q','e2','s4','q'],comp:false,top:4,bot:4};}
function choices(c){
const a=`${c.top}/${c.bot}`;let s;
if(!c.comp)s=[a,`${c.top}/8`,`${c.top+1}/4`,{2:'6/8',3:'6/8',4:'12/8',5:'4/4'}[c.top]];
else{const G=c.top/3;s=[a,`${G}/4`,`${c.top}/4`];s.push(c.top%2===0?`${c.top/2}/4`:`${c.top+3}/8`);}
s=[...new Set(s)];const extra=['2/4','3/4','4/4','6/8','3/8','5/4'];while(s.length<4){const e=rnd(extra);if(!s.includes(e))s.push(e);}
return s.slice(0,4).sort(()=>Math.random()-.5);}
const col='currentColor';
const tsH=(v,cls='')=>{const [a,b]=v.split('/');return `<span class="ts ${cls}" aria-label="${a} ${b}"><span>${a}</span><span>${b}</span></span>`;};
const head=(x,f)=>`<ellipse cx="${x}" cy="60" rx="7" ry="5" transform="rotate(-20 ${x} 60)" fill="${f?col:'none'}" stroke="${col}" stroke-width="1.6"/>`;
const stem=x=>`<line x1="${x+6.5}" y1="58" x2="${x+6.5}" y2="22" stroke="${col}" stroke-width="1.6"/>`;
const beam=(a,b,y)=>`<rect x="${a+5.7}" y="${y}" width="${b-a+1.6}" height="4.5" fill="${col}"/>`;
const rest=x=>`<path d="M${x} 40 L${x+8} 50 L${x+2} 57 L${x+9} 67 C${x+1} 63 ${x-2} 71 ${x+5} 78" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
const POS={e2:[0,.5],s4:[0,.25,.5,.75],es:[0,.5,.75],se:[0,.25,.5],e3:[0,1/3,2/3],s6:[0,1/6,2/6,3/6,4/6,5/6]};
const SEC={s4:[0,3],s6:[0,5],es:[1,2],se:[0,1]};
const WRONG={s4:4,e2:2,es:3,se:3,h:1,dh:2,r:0,e3:1,dq:1,s6:6};
function mini(k){let s,w;const H=50;
if(k==='r'){s=rest(8);w=24;}
else if(['q','h','dh','dq'].includes(k)){s=head(10,k==='q'||k==='dq')+stem(10);if(k==='dh'||k==='dq'){s+=`<circle cx="23" cy="57" r="2.2" fill="currentColor"/>`;w=30;}else w=24;}
else{const xs=POS[k].map((_,i)=>10+i*17);xs.forEach(x=>s=(s||'')+head(x,true)+stem(x));s+=beam(xs[0],xs[xs.length-1],20);if(SEC[k])s+=beam(xs[SEC[k][0]],xs[SEC[k][1]],28);w=xs[xs.length-1]+18;}
return `<svg viewBox="0 18 ${w} ${H+14}" height="30" width="${Math.round(w*30/(H+14))}" style="display:inline-block;vertical-align:middle;width:auto" aria-label="${NAME[k]}">${s}</svg>`;}
function draw(c,ann){
const items=c.items;let u=0;items.forEach(k=>u+=U[k]);X0=c.mode==='beats'?48:30;const step=(340-X0)/u;
$('staff').setAttribute('viewBox',ann?'0 0 360 128':'0 0 360 100');
let s='';
if(ann&&c.mode==='beats'){const bs=c.comp?3:2;let b=1;for(let k=0;k<u;k+=bs){const mx=X0+step*k-3;s+=`<circle cx="${mx}" cy="104" r="11" fill="var(--ok)"/><text x="${mx}" y="108.5" text-anchor="middle" font-size="13" font-weight="700" fill="var(--card)">${b++}</text>`;}}
else if(ann){let gx=X0;items.forEach((k,i)=>{const w=step*U[k],cl=`var(--g${i%2+1})`,x0=gx+3,x1=gx+w-3,mid=(x0+x1)/2;
const lab=c.comp?`${U[k]} eighths`:`${U[k]/2} ${U[k]===2?'beat':'beats'}`,bw=c.comp?70:50;
s+=`<path d="M${x0} 84 V91 H${x1} V84" fill="none" stroke="${cl}" stroke-width="2.5" stroke-linecap="round"/>`;
s+=`<rect x="${mid-bw/2}" y="98" width="${bw}" height="24" rx="12" fill="${cl}"/><text x="${mid}" y="114.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--on-g)">${lab}</text>`;
gx+=w;});}
s+=`<line x1="10" y1="60" x2="350" y2="60" stroke="${col}" stroke-opacity=".35"/><line x1="10" y1="40" x2="10" y2="80" stroke="${col}" stroke-width="1.5"/><line x1="350" y1="40" x2="350" y2="80" stroke="${col}" stroke-width="1.5"/>`;
if(c.mode==='beats')s+=`<text x="30" y="55" text-anchor="middle" font-size="22" font-weight="800" font-family="Georgia,serif" fill="${col}">${c.top}</text><text x="30" y="77" text-anchor="middle" font-size="22" font-weight="800" font-family="Georgia,serif" fill="${col}">${c.bot}</text>`;
let x=X0;
items.forEach(k=>{const w=step*U[k];
if(k==='r'){s+=rest(x+w*0.35);}
else if(['q','h','dh','dq'].includes(k)){const nx=x+step*0.6;s+=head(nx,k==='q'||k==='dq')+stem(nx);if(k==='dh'||k==='dq')s+=`<circle cx="${nx+13}" cy="57" r="2.2" fill="${col}"/>`;}
else{const xs=POS[k].map(p=>x+w*p+Math.min(w*0.1,10));xs.forEach(nx=>s+=head(nx,true)+stem(nx));
s+=beam(xs[0],xs[xs.length-1],20);if(SEC[k])s+=beam(xs[SEC[k][0]],xs[SEC[k][1]],28);}
x+=w;});
cur.u=u;cur.px=step;
if(markMode||checked){const bs=cur.comp?3:2,want=[];for(let k=0;k<u;k+=bs)want.push(k);
const all=[...new Set([...marks,...(checked?want:[])])].sort((a,b)=>a-b);
all.forEach(k=>{const mx=X0+step*k-3,isM=marks.has(k),good=want.includes(k);
let cl='var(--accent)',dash='';
if(checked){cl=isM&&good?'var(--ok)':isM?'var(--bad)':'var(--ok)';if(!isM)dash=' stroke-dasharray="4 4"';}
s+=`<line x1="${mx}" y1="12" x2="${mx}" y2="84" stroke="${cl}" stroke-width="2.5"${dash}/>`;
if(isM)s+=`<circle cx="${mx}" cy="10" r="5" fill="${cl}"/>`;});
if(markMode&&!checked)s+=`<rect x="12" y="4" width="336" height="88" fill="transparent" style="cursor:pointer"/>`;}
$('staff').innerHTML=s;}
let marks=new Set(),markMode=false,checked=false,X0=30;
function wantBeats(){const bs=cur.comp?3:2,w=[];for(let k=0;k<cur.u;k+=bs)w.push(k);return w;}
function itemAt(k){let a=0;for(const it of cur.items){if(k<a+U[it])return{it,start:a};a+=U[it];}return{it:cur.items[cur.items.length-1],start:a};}
function beatUI(){const on=markMode&&!checked;$('checkBeats').style.display='none';$('clearBeats').style.display=on&&marks.size?'':'none';
$('next').textContent=on?'Check my beats':(n===TOTAL-1?'See my results':'Next measure');}
$('clearBeats').onclick=()=>{marks=new Set();beatUI();draw(cur,answered);};
$('staff').addEventListener('click',e=>{if(!markMode||checked)return;const sv=$('staff'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
const p=pt.matrixTransform(sv.getScreenCTM().inverse());let k=Math.round((p.x-X0)/cur.px);k=Math.max(0,Math.min(cur.u-1,k));
marks.has(k)?marks.delete(k):marks.add(k);sfx('tick');beatUI();draw(cur,answered);});
function breakdown(topX,botX){
const unit=k=>cur.comp?`${U[k]} eighths`:`${U[k]/2} ${U[k]===2?'beat':'beats'}`;
const miss=x=>x?' <span class="xtag">you missed this</span>':'';
const chips=cur.items.map((k,i)=>`<span class="chip" style="border-color:var(--g${i%2+1})">${mini(k)}<span class="nm">${NAME[k]}</span><b>= ${unit(k)}</b></span>`).join('<span class="op">+</span>');
const sum=cur.items.map(k=>cur.comp?U[k]:U[k]/2).join(' + ');
const topRow=`<div class="ar${topX?' x':''}"><div class="hd"><b>Top number: ${cur.top}</b>${miss(topX)}<br><span class="muted">${cur.comp?'How many 8th notes fit in the measure':'How many beats (quarter notes) fit in the measure'}</span></div><div class="eq">${chips}</div><div class="sum">${sum} = <b>${cur.top}</b></div></div>`;
const uq=[...new Set(cur.items)].filter(k=>cur.comp?(k==='dq'||k==='s6'):k!=='q');
const rhs=k=>cur.comp?`${mini('e3')}<span class="nm">three 8ths</span>`:`${mini('q').repeat(U[k]/2)}<span class="nm">${U[k]===2?'one quarter':U[k]/2+' quarters'}</span>`;
const pairs=uq.length?`<div class="pairs">${uq.map(k=>`<div class="pair">${mini(k)}<span class="nm">${NAME[k]}</span><span class="op">=</span>${rhs(k)}</div>`).join('')}</div>`:'';
const why=cur.comp?`The 8ths come in groups of three ${mini('e3')}, so you count every 8th note. <b>8</b> stands for the 8th note.`:`Every beat is one ${mini('q')} quarter note. <b>4</b> stands for the quarter note.`;
const botRow=`<div class="ar${botX?' x':''}"><div class="hd"><b>Bottom number: ${cur.bot}</b>${miss(botX)}<br><span class="muted">${cur.comp?'Which note you count by':'Which note gets one beat'}</span></div>${pairs}<div class="bt">${why}</div></div>`;
return topRow+botRow;}
function beatBreakdown(){
const want=wantBeats();
const cells=want.map((k,i)=>{const {it,start}=itemAt(k);const hold=k!==start;
return `<div class="bcell${hold?' hold':''}"><span class="bn">${i+1}</span>${hold?`<span class="nm">still holding</span>${mini(it)}<span class="nm">${NAME[it]}</span>`:`${mini(it)}<span class="nm">${NAME[it]}</span>`}</div>`;}).join('');
const rule=cur.comp?`In ${tsH(cur.top+'/'+cur.bot,'i')}, a beat starts every ${mini('dq')} (three 8ths), so there are <b>${want.length}</b> big beats.`:`In ${tsH(cur.top+'/'+cur.bot,'i')}, a beat starts every ${mini('q')} (quarter note), so there are <b>${want.length}</b> beats.`;
return `<div class="rule1">${rule}</div><div class="beats">${cells}</div>`;}
function settle(ok,culprit,m){
const concept=cur.comp?'comp':'simp',types=[...new Set(cur.items)].filter(k=>k!=='q');
if(ok){correct++;streak++;missStreak=0;[...types,concept].forEach(k=>{if(weak[k]>1)weak[k]=Math.max(1,weak[k]-1.5);});
const f=focusType();
if(streak>=2&&level<3&&!f){level++;streak=0;m+=`<div class="muted" style="margin-top:6px">Leveling up.</div>`;}
else if(streak>=2&&f)m+=`<div class="muted" style="margin-top:6px">Get a couple more with ${NAME[f]} right to level up.</div>`;}
else{streak=0;missStreak++;
if(culprit){weak[culprit]=(weak[culprit]||1)+3;if(culprit!==concept)types.forEach(k=>{if(k!==culprit)weak[k]=(weak[k]||1)+1;});}
if(missStreak>=2&&level>1){level--;missStreak=0;m+=`<div class="muted" style="margin-top:6px">Stepping back to level ${level} to practice.</div>`;}}
log.push({items:cur.items,comp:cur.comp,ok});
$('score').textContent=correct+' correct';$('fb').innerHTML=m;}
$('checkBeats').onclick=()=>{if(!marks.size){$('beatMsg').innerHTML='<span class="wrong" style="font-size:13px">Tap the measure to place at least one beat first</span>';return;}

checked=true;answered=true;beatUI();draw(cur,true);
const want=wantBeats(),missed=want.filter(k=>!marks.has(k)),extra=[...marks].filter(k=>!want.includes(k));
const ok=!missed.length&&!extra.length;
$('beatMsg').innerHTML=ok?'':`<span class="muted">Solid green = right. Dashed green = beats you missed.${extra.length?' Red = extra marks.':''}</span>`;
let m=ok?`<span class="good">You found all ${want.length} beats.</span>`:`<span class="wrong">You found ${want.length-missed.length} of ${want.length} beats${extra.length?`, plus ${extra.length} extra`:''}.</span>`;
let culprit=null,lesson='';
if(!ok){
if(cur.comp){culprit='comp';lesson=`In ${cur.top}/8, each beat is a group of three 8ths ${mini('e3')}. Mark only the first note of each group of three.`;}
else{const cands=[];
missed.forEach(k=>{const {it,start}=itemAt(k);cands.push({k:it,why:k===start?'start':'inside'});});
extra.forEach(k=>{const {it}=itemAt(k);cands.push({k:it,why:'extra'});});
const c=cands.find(x=>x.why==='inside')||cands.find(x=>x.why==='extra')||cands[0];culprit=c.k==='q'&&cands.length>1?(cands.find(x=>x.k!=='q')||c).k:c.k;
const why=(cands.find(x=>x.k===culprit)||c).why;
if(why==='inside')lesson=`${mini(culprit)} A ${NAME[culprit]} lasts ${U[culprit]/2} beats, so a beat lands in the middle of it.`;
else if(why==='extra')lesson=POS[culprit]?`${mini(culprit)} ${NAME[culprit][0].toUpperCase()+NAME[culprit].slice(1)} make one beat together. Mark only the first note.`:`Beats are evenly spaced, one ${mini('q')} quarter note apart. A beat doesn't start partway through one.`;
else lesson=culprit==='r'?`${mini('r')} A quarter rest still gets a beat, even though it's silent.`:`${mini(culprit)} Each ${NAME[culprit]} starts a new beat.`;
if(culprit==='q')culprit=null;}
m+=`<div class="lesson">${lesson}</div>`;}
m+=beatBreakdown();
settle(ok,culprit,m);juice(ok,null);};
function render(){
playing++;const ph0=document.getElementById('ph');if(ph0)ph0.remove();
answered=false;checked=false;marks=new Set();cur=gen();cur.mode=n>0&&Math.random()<0.35?'beats':'sig';markMode=cur.mode==='beats';
draw(cur,false);beatUI();
$('beatMsg').innerHTML=markMode?'<span class="muted">Tap where each beat starts. Tap a line again to remove it.</span>':'';
$('sub').textContent=markMode?'Place the beats.':'Give me the time signature.';
$('qtext').innerHTML=markMode?`This measure is in ${tsH(cur.top+'/'+cur.bot,'i')}. Where do the beats start?`:"What's the time signature?";
$('choices').style.display=markMode?'none':'';
$('playBtn').textContent='▶ Play';anim($('game'),'rise');
$('qnum').textContent=`Question ${n+1} of ${TOTAL}`;$('lvl').textContent='Level '+level;$('fb').innerHTML='';
const f=focusType();const shown=f&&(f==='comp'?cur.comp:f==='simp'?!cur.comp:cur.items.includes(f));
$('focus').innerHTML=shown?`Practicing: <b>${NAME[f]}</b>`:'';
const ch=$('choices');ch.innerHTML='';
if(!markMode)choices(cur).forEach(c=>{const b=document.createElement('button');b.innerHTML=tsH(c);b.dataset.v=c;b.onclick=()=>pick(c,b);ch.appendChild(b);});
beatUI();}
function pick(c,b){
if(answered)return;answered=true;
const ans=`${cur.top}/${cur.bot}`,ok=c===ans,[pt,pb]=c.split('/').map(Number);
b.classList.add(ok?'ok':'bad');
if(!ok)[...$('choices').children].forEach(x=>{if(x.dataset.v===ans)x.classList.add('ok')});
draw(cur,true);
const topX=!ok&&pt!==cur.top,botX=!ok&&pb!==cur.bot,bd=breakdown(topX,botX);
const concept=cur.comp?'comp':'simp',types=[...new Set(cur.items)].filter(k=>k!=='q');
let m,culprit=null;
if(ok)m=`<span class="good">Right, it's ${tsH(ans,'i')}.</span>${bd}`;
else{m=`<span class="wrong">Not quite. You said ${tsH(c,'i')}, but it's ${tsH(ans,'i')}.</span>${bd}`;
if(pb!==cur.bot)culprit=concept;
else{const diff=pt-cur.top,pri=diff>0?['s4','s6','es','se','e2','e3','r','dq','dh','h']:['r','dh','h','dq','e3','e2','s4','s6','es','se'];
culprit=types.sort((a,b)=>(weak[b]||1)-(weak[a]||1)||pri.indexOf(a)-pri.indexOf(b))[0]||null;
if(culprit){const v=cur.comp?U[culprit]:U[culprit]/2,u=cur.comp?(v===1?'eighth':'eighths'):(v===1?'beat':'beats');
m+=`<div class="lesson"><b>Top number:</b> ${mini(culprit)} counts as ${v} ${u}${culprit==='r'?', even though it\'s silent':`, not ${WRONG[culprit]}`}.</div>`;}}}
settle(ok,culprit,m);juice(ok,b);}
function juice(ok,b){sfx(ok?'ok':'bad');if(b)anim(b,ok?'pop':'shake');anim($('fb'),'rise');if(ok)anim($('score'),'pop');$('playBtn').textContent='▶ Play with beat';setTimeout(()=>play(true),450);}
function finish(){
$('game').style.display='none';$('summary').style.display='';
$('sumTitle').textContent=`You got ${correct} of ${TOTAL} and reached level ${level}`;
const ranked=Object.keys(weak).filter(k=>weak[k]>1).sort((a,b)=>weak[b]-weak[a]).slice(0,2);
let h;
if(!log.some(l=>!l.ok))h=`<p>No misses. Nice work. Practice again for a new set of measures.</p>`;
else if(!ranked.length)h=`<p>You worked through your misses during the round. Practice again to lock it in.</p>`;
else h=`<p>What to work on next:</p><ul>${ranked.map(k=>`<li><b>${NAME[k]}</b>: ${TIP[k]}</li>`).join('')}</ul><p class="muted">Tip: first decide the bottom number from how the notes are grouped, then count for the top.</p>`;
$('sumBody').innerHTML=h;
sfx('win');if(correct>=TOTAL/2)confetti();anim($('summary'),'rise');}
let AC=null,muted=false,NB=null,playing=0;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function nbuf(c){if(!NB){NB=c.createBuffer(1,c.sampleRate*.5,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function env(c,g,t,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dec);}
function tone(t,f,type,peak,dec,f2){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dec*.6);env(c,g,t,peak,dec);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dec+.05);}
function noise(t,fType,freq,q,peak,dec){const c=ac();if(!c)return;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nbuf(c);f.type=fType;f.frequency.value=freq;f.Q.value=q;env(c,g,t,peak,dec);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+dec+.05);}
function boom(t){tone(t,110,'sine',.9,.38,46);noise(t,'lowpass',380,.7,.5,.12);}
function slap(t,v){noise(t,'bandpass',2300,.9,.55*v,.09);tone(t,230,'triangle',.18*v,.07);}
function click(t,acc){tone(t,acc?2400:1700,'sine',acc?.32:.22,.05);}
function sfx(kind){if(muted)return;const c=ac();if(!c)return;const t=c.currentTime+.01;
if(kind==='ok'){tone(t,880,'sine',.18,.22);tone(t+.09,1320,'sine',.18,.3);}
else if(kind==='bad'){tone(t,200,'triangle',.25,.28,120);}
else if(kind==='tick'){tone(t,3000,'sine',.12,.03);}
else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(t+i*.11,f,'sine',.18,.35));}}
function play(withBeats){if(muted||!cur)return;const c=ac();if(!c)return;const T=.28,t0=c.currentTime+.08,beats=wantBeats();let a=0;
cur.items.forEach(k=>{if(k!=='r')(POS[k]||[0]).forEach(p=>{const at=Math.round((a+p*U[k])*1000)/1000,t=t0+at*T;if(at===0)boom(t);else slap(t,beats.includes(at)?1:.45);});a+=U[k];});
if(withBeats)beats.forEach(b=>click(t0+b*T,b===0));
const id=++playing,dur=cur.u*T*1000,st=performance.now()+80;
(function frame(){if(id!==playing)return;const sv=$('staff');let ln=document.getElementById('ph');
if(!ln){ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.id='ph';ln.setAttribute('y1','14');ln.setAttribute('y2','84');ln.setAttribute('stroke','var(--accent)');ln.setAttribute('stroke-width','2');ln.setAttribute('stroke-opacity','.7');sv.appendChild(ln);}
const p=Math.min(1,Math.max(0,(performance.now()-st)/dur)),x=X0+p*(340-X0);ln.setAttribute('x1',x);ln.setAttribute('x2',x);
if(p<1)requestAnimationFrame(frame);else setTimeout(()=>{if(id===playing){const l=document.getElementById('ph');if(l)l.remove();}},150);})();}
function anim(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';document.body.appendChild(cv);
const x=cv.getContext('2d'),W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio,cols=['#7F77DD','#1D9E75','#EF9F27','#D4537E','#378ADD'];
const P=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.025-H*.005,r:(4+Math.random()*5)*devicePixelRatio,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
const st=performance.now();(function f(){const e=performance.now()-st;x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=H*.0009;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(e<2200)requestAnimationFrame(f);else cv.remove();})();}
$('playBtn').onclick=()=>{play(answered);};
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'Sound off':'Sound on';if(muted)playing++;};
function start(){n=0;level=1;streak=0;missStreak=0;correct=0;log=[];weak={};$('summary').style.display='none';$('game').style.display='';$('score').textContent='0 correct';render();}
$('next').onclick=()=>{if(markMode&&!checked){$('checkBeats').onclick();return;}if(!answered){$('fb').innerHTML=`<span class="wrong" style="font-size:13px">${markMode?'Place your beats and tap Check my beats first':'Pick an answer first'}</span>`;return;}if(n<TOTAL-1){n++;render();}else finish();};
$('again').onclick=start;
start();
</script>
